name: RDC Tara Ops CI/CD

# Automatic triggers are paused until the first production deployment is
# completed and verified manually.
on:
  workflow_dispatch:

concurrency:
  group: rdc-nova-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Validate Python syntax
        run: |
          python -m compileall -q backend/open_webui
          python -m py_compile tools/main_pipe.py

  container:
    name: Build production container
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: rdc-nova-ci:${{ github.sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            USE_SLIM=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Gemini embedding regression test
        run: >-
          docker run --rm --entrypoint python
          -e WEBUI_SECRET_KEY=ci-${{ github.sha }}
          rdc-nova-ci:${{ github.sha }}
          -m unittest open_webui.retrieval.test_utils_gemini_embeddings

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=pr

      - name: Publish production image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            USE_SLIM=true
          cache-from: type=gha
          sbom: true
          provenance: mode=max
