<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/logos/favicon-32x32.png"
			sizes="32x32"
			crossorigin="use-credentials"
		/>
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="%sveltekit.assets%/static/apple-touch-icon.png"
			crossorigin="use-credentials"
		/>
		<link
			rel="manifest"
			href="%sveltekit.assets%/manifest.json"
			crossorigin="use-credentials"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="theme-color" content="#171717" />
		<meta name="robots" content="noindex,nofollow" />

		<script
			src="%sveltekit.assets%/static/loader.js"
			defer
			crossorigin="use-credentials"
		></script>
		<link
			rel="stylesheet"
			href="%sveltekit.assets%/static/custom.css"
			crossorigin="use-credentials"
		/>

		<script>
			function resizeIframe(obj) {
				obj.style.height = obj.contentWindow.document.documentElement.scrollHeight + 'px';
			}
		</script>

		<script>
			// On page load or when changing themes, best to add inline in `head` to avoid FOUC
			(() => {
				const metaThemeColorTag = document.querySelector('meta[name="theme-color"]');
				const prefersDarkTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;

				if (!localStorage?.theme) {
					localStorage.theme = 'system';
				}

				if (localStorage.theme === 'system') {
					document.documentElement.classList.add(prefersDarkTheme ? 'dark' : 'light');
					metaThemeColorTag.setAttribute('content', prefersDarkTheme ? '#171717' : '#ffffff');
				} else if (localStorage.theme === 'oled-dark') {
					document.documentElement.style.setProperty('--color-gray-800', '#101010');
					document.documentElement.style.setProperty('--color-gray-850', '#050505');
					document.documentElement.style.setProperty('--color-gray-900', '#000000');
					document.documentElement.style.setProperty('--color-gray-950', '#000000');
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#000000');
				} else if (localStorage.theme === 'light') {
					document.documentElement.classList.add('light');
					metaThemeColorTag.setAttribute('content', '#ffffff');
				} else if (localStorage.theme === 'her') {
					document.documentElement.classList.add('her');
					metaThemeColorTag.setAttribute('content', '#983724');
				} else {
					document.documentElement.classList.add('dark');
					metaThemeColorTag.setAttribute('content', '#171717');
				}

				const assetsBase = '%sveltekit.assets%';
				const preloadHref = document.documentElement.classList.contains('dark')
					? `${assetsBase}/static/splash-dark.png`
					: `${assetsBase}/static/splash.png`;
				const preload = document.createElement('link');
				preload.rel = 'preload';
				preload.as = 'image';
				preload.href = preloadHref;
				preload.setAttribute('fetchpriority', 'high');
				document.head.appendChild(preload);

				window.matchMedia('(prefers-color-scheme: dark)').addListener((e) => {
					if (localStorage.theme === 'system') {
						if (e.matches) {
							document.documentElement.classList.add('dark');
							document.documentElement.classList.remove('light');
							metaThemeColorTag.setAttribute('content', '#171717');
						} else {
							document.documentElement.classList.add('light');
							document.documentElement.classList.remove('dark');
							metaThemeColorTag.setAttribute('content', '#ffffff');
						}
					}
				});
				const isDarkMode = document.documentElement.classList.contains('dark');

				const logo = document.createElement('img');
				logo.id = 'logo';
				logo.style =
					'width: 100%; height: auto; object-fit: contain; display:block;';
				logo.alt = '';
				logo.loading = 'eager';
				logo.fetchPriority = 'high';
				logo.src = isDarkMode
					? `${assetsBase}/static/splash-dark.png`
					: `${assetsBase}/static/splash.png`;

				document.addEventListener('DOMContentLoaded', function () {
					const splash = document.getElementById('splash-screen');
					if (document.documentElement.classList.contains('her')) {
						return;
					}

					if (splash) {
						const content = document.createElement('div');
						content.id = 'splash-content';
						content.appendChild(logo);

						const animation = document.createElement('div');
						animation.id = 'splash-animation';
						animation.setAttribute('aria-hidden', 'true');
						// Indeterminate activity, not a timed percentage or a video download.
						// The app layout removes the entire splash as soon as bootstrap finishes.
						const indicator = document.createElement('span');
						animation.appendChild(indicator);
						content.appendChild(animation);

						const status = document.createElement('div');
						status.id = 'splash-status';
						status.setAttribute('role', 'status');
						status.textContent = 'Loading…';
						content.appendChild(status);
						splash.prepend(content);
					}
				});
			})();
		</script>

		<title>Open WebUI</title>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<div
			id="splash-screen"
			style="position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%"
		>
			<style type="text/css" nonce="">
				html {
					overflow-y: scroll !important;
				}
			</style>

			<div
				style="
					position: absolute;
					top: 33%;
					left: 50%;

					width: 24rem;
					transform: translateX(-50%);

					display: flex;
					flex-direction: column;
					align-items: center;
				"
			>
				<img
					id="logo-her"
					style="width: auto; height: 13rem"
					src="%sveltekit.assets%/static/splash.png"
					loading="eager"
					fetchpriority="high"
					class="animate-pulse-fast"
				/>

				<div style="position: relative; width: 24rem; margin-top: 0.5rem">
					<div
						id="progress-background"
						style="
							position: absolute;
							width: 100%;
							height: 0.75rem;

							border-radius: 9999px;
							background-color: #fafafa9a;
						"
					></div>

					<div
						id="progress-bar"
						style="
							position: absolute;
							width: 0%;
							height: 0.75rem;
							border-radius: 9999px;
							background-color: #fff;
						"
						class="bg-white"
					></div>
				</div>
			</div>

			<!-- <span style="position: absolute; bottom: 32px; left: 50%; margin: -36px 0 0 -36px">
				Footer content
			</span> -->
		</div>
	</body>

	<style type="text/css" nonce="">
		html {
			overflow-y: hidden !important;
			overscroll-behavior-y: none;
		}

		#splash-screen {
			background: #fff;
		}

		html.dark #splash-screen {
			background: #000;
		}

		#splash-content {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: min(16rem, 70vw);
			text-align: center;
		}

		#splash-animation {
			position: relative;
			width: 8rem;
			height: 0.25rem;
			margin: -0.75rem auto 0;
			border-radius: 9999px;
			background: #e5e7eb;
			overflow: hidden;
		}

		#splash-animation span {
			position: absolute;
			inset: 0 auto 0 0;
			width: 40%;
			border-radius: inherit;
			background: #16a34a;
			animation: splash-loading 0.9s ease-in-out infinite;
		}

		html.dark #splash-animation {
			background: #262626;
		}

		html.dark #splash-animation span {
			background: #4ade80;
		}

		@keyframes splash-loading {
			from { transform: translateX(-100%); }
			to { transform: translateX(250%); }
		}

		#splash-status {
			margin-top: 0.875rem;
			font: 500 0.75rem/1.5 'Archivo', 'Inter', ui-sans-serif, system-ui, sans-serif;
			letter-spacing: 0.04em;
			color: #737373;
		}

		html.dark #splash-status {
			color: #a3a3a3;
		}

		@media (prefers-reduced-motion: reduce) {
			#splash-animation span {
				animation: none;
				transform: translateX(75%);
			}
			.animate-pulse-fast {
				animation: none !important;
			}
		}

		html.her #splash-screen {
			background: #983724;
		}

		#logo-her {
			display: none;
		}

		#progress-background {
			display: none;
		}

		#progress-bar {
			display: none;
		}

		html.her #logo {
			display: none;
		}

		html.her #logo-her {
			display: block;
			filter: invert(1);
		}

		html.her #progress-background {
			display: block;
		}

		html.her #progress-bar {
			display: block;
		}

		@media (max-width: 24rem) {
			html.her #progress-background {
				display: none;
			}

			html.her #progress-bar {
				display: none;
			}
		}

		@keyframes pulse {
			50% {
				opacity: 0.65;
			}
		}

		.animate-pulse-fast {
			animation: pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
		}
	</style>
</html>
